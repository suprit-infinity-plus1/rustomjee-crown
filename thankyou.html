<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You – Rustomjee</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font (optional) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #000;
            /* Black background */
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .thank-you-box {
            text-align: center;
            padding: 50px 40px;
            background: #111;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
            max-width: 700px;
            width: 100%;
        }

        .thank-you-box h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #f0b01a;
        }

        .thank-you-box p {
            font-size: 1.2rem;
            color: #ccc;
            margin-top: 15px;
        }

        .brand {
            font-weight: 600;
            color: #fff;
            font-size: 1.4rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .back-link {
            display: inline-block;
            margin-top: 35px;
            text-decoration: none;
            border: 2px solid #f0b01a;
            padding: 12px 28px;
            color: #f0b01a;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            background: #f0b01a;
            color: #000;
        }
    </style>
</head>

<body>

    <div class="thank-you-box">
        <div class="brand">Rustomjee</div>
        <h1>Thank You!</h1>
        <p>Your enquiry has been successfully submitted.</p>
        <p>Our team will contact you shortly to assist with your request.</p>
        <a href="index.html" class="back-link">← Go Back to Home</a>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
